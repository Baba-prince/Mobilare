<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment cancelled — Mobilare</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:'DM Sans',system-ui,sans-serif; color:#f4f7fa;
      background: radial-gradient(800px 400px at 80% 10%, rgba(180,35,24,.2), transparent 50%), #0B1015; }
    .card { width:min(440px, calc(100% - 2rem)); padding:1.75rem; border-radius:16px;
      border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); }
    h1 { font-family:Syne,sans-serif; font-size:1.5rem; margin:0 0 .5rem; }
    p { color:#c5d0d8; font-size:.9rem; line-height:1.45; }
    a { color:#00A8CC; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment cancelled</h1>
    <p>No charge was made. Your quote may still be valid for a few minutes.</p>
    <p><a href="../book/">Return to booking →</a></p>
  </div>
</body>
</html>
